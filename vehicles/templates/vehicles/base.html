<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vehicle Market Intel{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17202a; background: #f4f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        header { background: #14213d; color: white; }
        nav, main { width: min(1180px, calc(100% - 2rem)); margin: auto; }
        nav { min-height: 64px; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
        nav strong { margin-right: auto; }
        nav a { color: white; text-decoration: none; }
        main { padding: 2rem 0 4rem; }
        h1, h2 { line-height: 1.2; }
        a { color: #1358a2; }
        .panel, .card { background: white; border: 1px solid #dce1e6; border-radius: .55rem; padding: 1rem; }
        .filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; }
        label { display: grid; gap: .3rem; font-size: .9rem; font-weight: 600; }
        input, select, button { width: 100%; padding: .6rem; border: 1px solid #aeb7c2; border-radius: .35rem; background: white; font: inherit; }
        button, .button { background: #1769aa; color: white; border: 0; cursor: pointer; text-decoration: none; display: inline-block; padding: .65rem 1rem; border-radius: .35rem; width: auto; }
        .actions { display: flex; align-items: end; gap: .6rem; }
        .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 1rem; }
        .listing-thumbnail { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #e7eaed; margin-bottom: .8rem; }
        .meta { color: #58636f; }
        .price { font-size: 1.35rem; font-weight: 700; }
        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
        .stat { padding: .8rem; background: #f7f9fb; border-radius: .4rem; }
        .stat span { display: block; color: #58636f; font-size: .85rem; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { text-align: left; padding: .7rem; border-bottom: 1px solid #dce1e6; white-space: nowrap; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: .45rem; margin-top: 1.5rem; min-height: 40px; }
        .pagination a, .pagination span { color: #1358a2; background: white; border: 1px solid #b9c3cd; border-radius: .3rem; min-width: 2.5rem; height: 2.5rem; padding: .45rem .7rem; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .pagination a:hover { background: #edf4fb; }
        .pagination .current { color: white; background: #1769aa; border-color: #1769aa; font-weight: 700; }
        .errors { color: #8b1e1e; background: #fff0f0; padding: .8rem 1rem; border-radius: .4rem; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #eaf7ee; border: 1px solid #9ac9a6; padding: .8rem 1rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .form-grid .full { grid-column: 1 / -1; }
        .status { display: inline-block; padding: .2rem .45rem; border-radius: .3rem; background: #e5e9ed; }
        .status.active { color: #17602b; background: #e6f4ea; }
        .section { margin-top: 2rem; }
        @media (max-width: 850px) { .filters, .grid, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 560px) { nav strong { width: 100%; margin-top: .8rem; } .filters, .grid, .stats { grid-template-columns: 1fr; } main { padding-top: 1rem; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <strong><a href="{% url 'home' %}">Vehicle Market Intel</a></strong>
            <a href="{% url 'market:listing_list' %}">Marketplace listings</a>
            <a href="{% url 'market_profiles:list' %}">Market profiles</a>
            <a href="{% url 'classification_review' %}">Classification review</a>
            <a href="{% url 'source_search_list' %}">Source searches</a>
            <a href="{% url 'vehicles:vehicle_list' %}">Manual vehicles</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>
    <main>
        {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
